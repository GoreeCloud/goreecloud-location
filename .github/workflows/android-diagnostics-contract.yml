name: Android Diagnostics Contract

on:
  pull_request:
    paths:
      - 'apps/android/**'
      - '.github/workflows/android-diagnostics-contract.yml'
  push:
    branches:
      - main
    paths:
      - 'apps/android/**'
      - '.github/workflows/android-diagnostics-contract.yml'

permissions:
  contents: read

jobs:
  android-diagnostics:
    name: Battery policy, diagnostics, and collector build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/android
    steps:
      - name: Check out exact source
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle 9.5
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.5.0'

      - name: Test battery and diagnostics policy
        run: gradle --no-daemon :app:testDebugUnitTest

      - name: Build debug collector
        run: gradle --no-daemon :app:assembleDebug
