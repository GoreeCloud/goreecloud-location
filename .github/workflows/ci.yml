name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: location-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  api:
    name: Go API
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/api
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: services/api/go.mod
          cache-dependency-path: services/api/go.sum

      - name: Download and verify modules
        run: |
          go mod download
          go mod verify

      - name: Verify formatting
        shell: bash
        run: |
          set -euo pipefail
          unformatted="$(gofmt -l .)"
          if [[ -n "$unformatted" ]]; then
            printf 'Go files require gofmt:\n%s\n' "$unformatted" >&2
            gofmt -d $unformatted >&2
            exit 1
          fi

      - name: Vet
        run: go vet ./...

      - name: Test
        run: go test ./...

      - name: Build API, admin, and migration tools
        run: |
          go build ./cmd/location-api
          go build ./cmd/location-admin
          go build ./cmd/location-migrate

  database:
    name: PostgreSQL, PostGIS, Auth, and Tracking Isolation
    runs-on: ubuntu-latest
    services:
      postgis:
        image: postgis/postgis:17-3.5@sha256:83e9999dc3ad8390c210e76130c3a16365ef4f957bb55200d22b7937cfbcb321
        env:
          POSTGRES_DB: goreecloud_location
          POSTGRES_USER: goreecloud_location
          POSTGRES_PASSWORD: goreecloud_location_ci_only_not_secret
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U goreecloud_location -d goreecloud_location"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      LOCATION_CI_DATABASE_PASSWORD: goreecloud_location_ci_only_not_secret
      LOCATION_DATABASE_HOST: 127.0.0.1
      LOCATION_DATABASE_PORT: "5432"
      LOCATION_DATABASE_NAME: goreecloud_location
      LOCATION_DATABASE_USER: goreecloud_location
      LOCATION_DATABASE_PASSWORD: goreecloud_location_ci_only_not_secret
      LOCATION_DATABASE_SSLMODE: disable
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: services/api/go.mod
          cache-dependency-path: services/api/go.sum

      - name: Download and verify modules
        working-directory: services/api
        run: |
          go mod download
          go mod verify

      - name: Apply migrations through the API database path
        working-directory: services/api
        run: |
          go run ./cmd/location-migrate -dir ../../migrations
          go run ./cmd/location-migrate -dir ../../migrations

      - name: Verify schema ownership and PostGIS behavior
        shell: bash
        run: |
          set -euo pipefail
          docker exec -i "${{ job.services.postgis.id }}" \
            env PGPASSWORD="$LOCATION_CI_DATABASE_PASSWORD" \
            psql -v ON_ERROR_STOP=1 -U goreecloud_location -d goreecloud_location \
            < tests/integration/database.sql

      - name: Verify schema-aware API readiness
        shell: bash
        working-directory: services/api
        env:
          LOCATION_API_ADDRESS: 127.0.0.1:18080
        run: |
          set -euo pipefail
          go run ./cmd/location-api > "$RUNNER_TEMP/location-api.log" 2>&1 &
          api_pid=$!
          trap 'kill "$api_pid" 2>/dev/null || true' EXIT

          for _ in $(seq 1 45); do
            if curl --fail --silent http://127.0.0.1:18080/readyz > /dev/null; then
              exit 0
            fi
            sleep 1
          done

          cat "$RUNNER_TEMP/location-api.log" >&2
          exit 1

      - name: Verify authenticated user and device isolation
        env:
          LOCATION_API_ADDRESS: 127.0.0.1:18081
        run: bash ./tests/integration/auth-api.sh

      - name: Verify native tracking isolation and controls
        env:
          LOCATION_API_ADDRESS: 127.0.0.1:18082
        run: bash ./tests/integration/tracking-api.sh

  web:
    name: TypeScript Web
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Verify Glaze UI 2.0 source contract
        shell: bash
        run: |
          set -euo pipefail
          grep -F 'data-glaze-version="2.0.0"' src/main.ts > /dev/null
          if grep -R -n -E 'Glaze UI 1\.[0-9]|data-glaze-version="1\.' src; then
            echo "Location web source still contains a stale Glaze UI 1.x contract." >&2
            exit 1
          fi

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Type-check and build
        run: npm run build

  android:
    name: Android Collector
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/android
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle 9.5
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.5.0"

      - name: Build debug Android collector
        run: gradle --no-daemon :app:assembleDebug
