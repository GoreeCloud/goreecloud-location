# yamllint disable rule:line-length
# The reusable workflow checks out and verifies the exact caller revision; this lane is kept synchronized with repository CI for review heads.
name: Platform Contract

"on":
  pull_request:
    paths:
      - goreecloud.platform.yaml
      - .github/workflows/platform-contract.yml
  push:
    branches:
      - main
    paths:
      - goreecloud.platform.yaml
      - .github/workflows/platform-contract.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    uses: GoreeCloud/GoreeCloud/.github/workflows/reusable-platform-manifest.yml@dd7701b116d210a82ec0cb18ccb84b553b6e87e1
    with:
      manifest-path: goreecloud.platform.yaml
